# 開発・テスト用の依存サービス（アプリ本体はホストで npm run dev）
name: voiloid-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: voiloid
      POSTGRES_PASSWORD: voiloid
      POSTGRES_DB: voiloid
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 統合テスト専用 DB（voiloid_test）を作る。開発 DB とは完全に分離する
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiloid -d voiloid"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
